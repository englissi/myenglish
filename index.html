<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 뮤엠영어 영단어 챌린지 ✨</title>
    <!-- 아기자기한 구글 폰트 적용 -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #fff9e6;
            margin: 0;
            padding: 20px;
            color: #555;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: white;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(255, 183, 77, 0.3);
            border: 4px solid #ffcc80;
        }
        h1 {
            text-align: center;
            color: #ff7043;
            font-size: 28px;
            margin-bottom: 10px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            color: #ffa726;
            margin-bottom: 25px;
        }
        .card {
            background: #fff8f0;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 2px dashed #ffcc80;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ffb74d;
            border-radius: 12px;
            font-family: 'Jua', sans-serif;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 10px;
            text-align: center;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ff7043;
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Jua', sans-serif;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px #d84315;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 #d84315;
        }
        .hidden { display: none !important; }
        
        /* 랭킹 스타일 */
        .rank-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .rank-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            margin-bottom: 8px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ffe0b2;
            font-size: 16px;
        }
        .rank-item.top-1 {
            background: #fff3e0;
            border: 2px solid #ffa726;
            font-weight: bold;
            color: #e65100;
        }
        .word-quiz-box {
            text-align: center;
        }
        .word-display {
            font-size: 28px;
            color: #3f51b5;
            margin: 15px 0;
        }
        .word-part {
            font-size: 14px;
            background: #e3f2fd;
            color: #1565c0;
            padding: 3px 8px;
            border-radius: 8px;
            display: inline-block;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .opt-btn {
            background-color: #e3f2fd;
            color: #1565c0;
            box-shadow: 0 4px #90caf9;
            font-size: 15px;
            padding: 10px;
        }
        .opt-btn:active {
            box-shadow: 0 0 #90caf9;
        }
        .user-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #e8f5e9;
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            color: #2e7d32;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🍫 초콜릿 쟁탈 어휘 랭킹!</h1>
    <div class="subtitle">매월 1일 점수가 갱신됩니다! 1등에게는 달콤한 초콜릿이 🎁</div>

    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="card">
        <h3>👋 이름(고유 닉네임)을 입력해 주세요!</h3>
        <input type="text" id="nickname-input" placeholder="예: 강남킹콩, 영어천재">
        <button onclick="loginUser()">시작하기 🚀</button>
    </div>

    <!-- 2. 메인 학습 및 랭킹 화면 -->
    <div id="main-screen" class="hidden">
        <div class="user-info-bar">
            <span id="welcome-msg">환영합니다!</span>
            <button style="width: auto; padding: 5px 10px; font-size: 14px; background: #9e9e9e; box-shadow: 0 3px #616161;" onclick="logout()">로그아웃</button>
        </div>

        <!-- 퀴즈 카드 -->
        <div class="card word-quiz-box">
            <h4>🧠 단어 뜻 맞추기 (+10점)</h4>
            <div id="word-part" class="word-part">v</div>
            <div id="word-target" class="word-display">abandon</div>
            <div class="options-grid">
                <button class="opt-btn" onclick="checkAnswer(0)" id="opt0">뜻 1</button>
                <button class="opt-btn" onclick="checkAnswer(1)" id="opt1">뜻 2</button>
                <button class="opt-btn" onclick="checkAnswer(2)" id="opt2">뜻 3</button>
                <button class="opt-btn" onclick="checkAnswer(3)" id="opt3">뜻 4</button>
            </div>
        </div>

        <!-- 실시간 랭킹 카드 -->
        <div class="card">
            🏆 <b>이번 달 랭킹 TOP 5</b>
            <ul id="rank-list" class="rank-list" style="margin-top: 10px;">
                <!-- 랭킹 동적 로드 -->
            </ul>
        </div>
    </div>
</div>

<script>
    // 💡 [설정] 본인의 Supabase 프로젝트 정보 입력 필요
    const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentNickname = '';
    let currentScore = 0;

    // 업로드해주신 CSV 데이터 기반 어휘 리스트
    const vocabList = [
        { word: "abandon", part: "v", meaning: "버리다" },
        { word: "ability", part: "n", meaning: "능력" },
        { word: "absorb", part: "v", meaning: "흡수하다" },
        { word: "abundant", part: "adj", meaning: "풍족한, 풍부한" },
        { word: "accept", part: "v", meaning: "받아들이다" },
        { word: "access", part: "n", meaning: "접근" },
        { word: "accompany", part: "v", meaning: "동행하다" },
        { word: "accomplish", part: "v", meaning: "성취하다, 완수하다" },
        { word: "accurate", part: "adj", meaning: "정확한" },
        { word: "achieve", part: "v", meaning: "달성하다" },
        { word: "active", part: "adj", meaning: "활동적인" },
        { word: "adapt", part: "v", meaning: "적응하다" },
        { word: "adequate", part: "adj", meaning: "적절한, 충분한" },
        { word: "admire", part: "v", meaning: "존경하다, 감탄하며 보다" },
        { word: "admit", part: "v", meaning: "인정하다, 입장시키다" },
        { word: "adopt", part: "v", meaning: "입양하다, 채택하다" },
        { word: "adult", part: "n", meaning: "성인" },
        { word: "advance", part: "v", meaning: "전진하다, 발전하다" },
        { word: "advantage", part: "n", meaning: "이점, 유리함" },
        { word: "advertise", part: "v", meaning: "광고하다" }
    ];
    let currentQuiz = {};

    async function loginUser() {
        const input = document.getElementById('nickname-input').value.trim();
        if (!input) {
            alert('닉네임을 입력해 주세요!');
            return;
        }
        currentNickname = input;
        
        await loadOrCreateUser();

        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-screen').classList.remove('hidden');
        document.getElementById('welcome-msg').innerHTML = `👤 ${currentNickname}님 (점수: <span id='my-score'>${currentScore}</span>점)`;
        
        nextQuiz();
        fetchRankings();
    }

    function logout() {
        currentNickname = '';
        currentScore = 0;
        document.getElementById('nickname-input').value = '';
        document.getElementById('main-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }

    // Supabase 연동 및 매월 1일 자동 갱신 로직
    async function loadOrCreateUser() {
        const now = new Date();
        const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');

        let { data, error } = await supabaseClient
            .from('vocab_rankings')
            .select('*')
            .eq('nickname', currentNickname)
            .single();

        if (error || !data) {
            await supabaseClient.from('vocab_rankings').insert([
                { nickname: currentNickname, score: 0, last_month: currentMonth }
            ]);
            currentScore = 0;
        } else {
            if (data.last_month !== currentMonth) {
                await supabaseClient.from('vocab_rankings')
                    .update({ score: 0, last_month: currentMonth })
                    .eq('nickname', currentNickname);
                currentScore = 0;
            } else {
                currentScore = data.score;
            }
        }
    }

    // 퀴즈 출제 및 오답 보기 자동 생성
    function nextQuiz() {
        const randomIndex = Math.floor(Math.random() * vocabList.length);
        currentQuiz = vocabList[randomIndex];

        document.getElementById('word-target').innerText = currentQuiz.word;
        document.getElementById('word-part').innerText = currentQuiz.part;

        // 다른 단어의 뜻 중에서 오답 보기 3개 무작위 추출
        let wrongPool = vocabList.filter(item => item.meaning !== currentQuiz.meaning);
        wrongPool.sort(() => Math.random() - 0.5);
        
        let options = [currentQuiz.meaning, wrongPool[0].meaning, wrongPool[1].meaning, wrongPool[2].meaning];
        options.sort(() => Math.random() - 0.5);

        for (let i = 0; i < 4; i++) {
            const btn = document.getElementById(`opt${i}`);
            btn.innerText = options[i];
            btn.onclick = () => checkAnswer(options[i]);
        }
    }

    async function checkAnswer(selectedOption) {
        if (selectedOption === currentQuiz.meaning) {
            currentScore += 10;
            alert('정답입니다! 🎉 (+10점)');
            
            await supabaseClient.from('vocab_rankings')
                .update({ score: currentScore })
                .eq('nickname', currentNickname);

            document.getElementById('welcome-msg').innerHTML = `👤 ${currentNickname}님 (점수: <span id='my-score'>${currentScore}</span>점)`;
            
            fetchRankings();
            nextQuiz();
        } else {
            alert(`아쉽 틀렸어요! 😢 정답은 "${currentQuiz.meaning}" 입니다.`);
            nextQuiz();
        }
    }

    // 랭킹 불러오기
    async function fetchRankings() {
        let { data, error } = await supabaseClient
            .from('vocab_rankings')
            .select('nickname, score')
            .order('score', { ascending: false })
            .limit(5);

        if (error) {
            console.error('랭킹 불러오기 실패:', error);
            return;
        }

        const rankListEl = document.getElementById('rank-list');
        rankListEl.innerHTML = '';

        data.forEach((user, index) => {
            const li = document.createElement('li');
            li.className = `rank-item ${index === 0 ? 'top-1' : ''}`;
            li.innerHTML = `<span>${index + 1}위 ${user.nickname}</span> <b>${user.score}점</b>`;
            rankListEl.appendChild(li);
        });
    }
</script>

</body>
</html>
